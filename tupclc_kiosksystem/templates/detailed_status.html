<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Availability Status | TUPC Learning Commons</title>

    <!--
        Page-scoped layout fix (this page only - does not touch other
        pages that share style.css). It builds a real height chain from
        the viewport down to the timeline so the timeline can flex to
        fill whatever room is left, instead of growing past the window.
    -->
    <style>
        /* Every element sized by width/height already INCLUDES its own
           padding and border. Without this, a couple of elements here
           add padding on top of a flex-computed size, which is normally
           invisible but can round to 1-2px over budget at odd browser
           zoom levels (90%, 110%, 125%...) and force a stray scrollbar
           or clipped edge. This closes that gap at every zoom level. */
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden; /* the page itself never scrolls, in either direction */
        }

        .navbar {
            flex: 0 0 auto;
        }

        .main-content {
            flex: 1 1 auto;
            min-height: 0; /* lets this row shrink instead of overflowing the viewport */
            min-width: 0;  /* same, but sideways - stops wide content pushing the page out */
        }

        .left-panel {
            display: flex;
            min-height: 0;
            min-width: 0;
        }

        .status-card {
            min-height: 0;
            min-width: 0;
        }
    </style>
</head>

<body>
    <!-- NAVIGATION BAR -->
    <div class="navbar">
        <div class="navbar-content">
            <div class="navbar-logo">
                <img src="{{ url_for('static', filename='tuplogo.png') }}" alt="Logo">
            </div>
            <div>
                <h4>Technological University of the Philippines - Cavite</h4>
                <h2>Learning Commons</h2>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content" style="gap: 1rem;">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="status-card">
                <h1>&lsaquo; Learning Stations Availability Status</h1>

                <!-- TOP STATUS -->
                <div class="top-status">

                    <!-- LEFT -->
                    <div class="status-left">
                        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                            <div style="display:flex;flex-direction:column;">
                                <input type="date" id="appt_date" class="date-pill" required>
                            </div>

                            <div style="display:flex;flex-direction:column;">
                                <select id="dashboard-location-select" class="location-pill">
                                    {% for loc in locations %}
                                    <option value="{{ loc }}">{{ loc }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div style="display:flex;align-items:center;">
                                <button id="schedule-btn" class="pill-btn" type="button" onclick="window.location.href='/dashboard'">Schedule an Appointment</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STATUS SUMMARY (optional quick counts) -->
                <div id="status-summary" class="status-summary"></div>

                <!-- NO LOCATIONS NOTICE -->
                <div id="no-locations-notice" class="closed-notice" style="display:none;">
                    No active locations are currently configured.
                </div>

                <!-- TIMELINE -->
                <!-- The arrows always flank the timeline box, even on a day the
                     Learning Commons is closed, so the user can keep stepping
                     through dates without the layout jumping around. -->
                <div class="timeline-outer">
                    <button type="button" class="scroll-btn scroll-left" id="scrollLeftBtn" aria-label="Previous day" title="Previous day" onclick="shiftSelectedDate(-1)">&lsaquo;</button>

                    <div class="timeline-scroll" id="timelineScroll">
                        <div class="timeline-grid" id="timelineGrid"></div>
                        <div id="closed-notice" class="closed-notice timeline-message" style="display:none;">
                            The Learning Commons is closed for the selected date.
                        </div>
                    </div>

                    <button type="button" class="scroll-btn scroll-right" id="scrollRightBtn" aria-label="Next day" title="Next day" onclick="shiftSelectedDate(1)">&rsaquo;</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        // -------------------------------------------------------
        // CONFIGURATION
        // -------------------------------------------------------

        const DAY_START_HOUR = 8;   // 8:00 AM
        const DAY_END_HOUR   = 17;  // 5:00 PM
        const SLOT_MINUTES   = 30;  // half-hour resolution for block placement
        const SLOTS_PER_DAY  = ((DAY_END_HOUR - DAY_START_HOUR) * 60) / SLOT_MINUTES; // 18
        const TIME_COL_WIDTH = 90;  // px, the sticky time-label column - must match style.css
        const VISIBLE_STATIONS = 8; // how many station columns should fit on screen before scrolling kicks in
        const MIN_STATION_COL_WIDTH = 90; // px floor so columns never get too narrow to read
        const HOUR_LABELS = [];
        for (let h = DAY_START_HOUR; h <= DAY_END_HOUR; h++) {
            HOUR_LABELS.push(h);
        }

        const statusLabels = {
            vacant:   "Vacant",
            occupied: "Occupied",
            reserved: "Reserved",
            closed:   "Closed",
        };

        function normalizeStatus(status) {
            if (!status) return "reserved";
            const normalized = String(status).trim().toLowerCase();
            if (normalized === "occupied" || normalized === "reserved" || normalized === "vacant" || normalized === "closed") {
                return normalized;
            }
            if (normalized === "available" || normalized === "free") return "vacant";
            return "reserved";
        }

        let stationsData = []; // [{ name, appointments: [{status,start,end}, ...] }]

        // -------------------------------------------------------
        // CLOSED-DAY HELPERS (weekends / outside dept. hours)
        // -------------------------------------------------------

        function formatHour12(h) {
            const period = h >= 12 ? "PM" : "AM";
            let hour12 = h % 12;
            if (hour12 === 0) hour12 = 12;
            return hour12 + ":00 " + period;
        }

        function isSelectedDateWeekend() {
            const dateInput = document.getElementById("appt_date");
            if (!dateInput.value) return false;
            // Parse as local date to avoid timezone off-by-one
            const [y, m, d] = dateInput.value.split("-").map(Number);
            const day = new Date(y, m - 1, d).getDay(); // 0 = Sunday, 6 = Saturday
            return day === 0 || day === 6;
        }

        // -------------------------------------------------------
        // TIME PARSING
        // Accepts "HH:MM", "HH:MM:SS" (24hr) or "h:MM AM/PM" strings
        // and returns minutes elapsed since DAY_START_HOUR:00.
        // -------------------------------------------------------

        function minutesSinceDayStart(timeStr) {
            if (!timeStr) return null;

            let hours, minutes;
            const ampmMatch = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

            if (ampmMatch) {
                hours = parseInt(ampmMatch[1], 10);
                minutes = parseInt(ampmMatch[2], 10);
                const period = ampmMatch[3].toUpperCase();
                if (period === "PM" && hours !== 12) hours += 12;
                if (period === "AM" && hours === 12) hours = 0;
            } else {
                const parts = timeStr.trim().split(":");
                hours = parseInt(parts[0], 10);
                minutes = parseInt(parts[1], 10);
            }

            const totalMinutes = (hours - DAY_START_HOUR) * 60 + minutes;
            // Clamp inside the visible day window
            return Math.max(0, Math.min(totalMinutes, SLOTS_PER_DAY * SLOT_MINUTES));
        }

        // Converts a time string into a 1-based grid row (row 1 is the header row)
        function timeToGridRow(timeStr) {
            const mins = minutesSinceDayStart(timeStr);
            if (mins === null) return 2;
            const slot = Math.round(mins / SLOT_MINUTES);
            return 2 + slot; // rows 2..(2+SLOTS_PER_DAY) are the body rows
        }

        function formatTimeLabel(timeStr) {
            if (!timeStr) return "";
            const ampmMatch = timeStr.trim().match(/^\d{1,2}:\d{2}\s*(AM|PM)$/i);
            if (ampmMatch) return timeStr.trim();

            const parts = timeStr.trim().split(":");
            let hours = parseInt(parts[0], 10);
            const minutes = parts[1];
            const period = hours >= 12 ? "PM" : "AM";
            let hour12 = hours % 12;
            if (hour12 === 0) hour12 = 12;
            return hour12 + ":" + minutes + " " + period;
        }

        // -------------------------------------------------------
        // FETCH ACTIVE LOCATIONS FROM THE SERVER
        //
        // Same pattern as dashboard.html's fetchLocations() /
        // populateLocationSelects(): the "Location" dropdown is kept in
        // sync with the `stations` table (GET /api/locations) instead
        // of a hardcoded list, so any location added/renamed/closed via
        // the admin system's Manage Stations page shows up here
        // automatically - and reservations under a newly added
        // location aren't invisible just because the dropdown never
        // offered it. cache: "no-store" matches dashboard.html so this
        // page never renders a browser-cached copy of the location list.
        // -------------------------------------------------------

        function populateLocationSelect(locations) {
            const locationSelect = document.getElementById("dashboard-location-select");
            const noLocationsNotice = document.getElementById("no-locations-notice");
            const timelineScroll = document.getElementById("timelineScroll");

            if (!Array.isArray(locations) || locations.length === 0) {
                locationSelect.innerHTML = "";
                noLocationsNotice.style.display = "block";
                timelineScroll.style.display = "none";
                return;
            }

            noLocationsNotice.style.display = "none";

            const previousValue = locationSelect.value;

            locationSelect.innerHTML = "";
            locations.forEach(function (loc) {
                const option = document.createElement("option");
                option.value = loc;
                option.textContent = loc;
                locationSelect.appendChild(option);
            });

            if (locations.includes(previousValue)) {
                // Keep whatever the user had selected, if it's still active.
                locationSelect.value = previousValue;
            } else {
                // The location currently being viewed disappeared (e.g. it
                // was deactivated) - fall back to the first active one and
                // refresh the timeline to match.
                locationSelect.value = locations[0];
                fetchStationSchedule();
            }
        }

        async function fetchLocations() {
            try {
                const response = await fetch("/api/locations", { cache: "no-store" });
                const result = await response.json();
                if (result.success && Array.isArray(result.locations)) {
                    populateLocationSelect(result.locations);
                } else {
                    console.error("Failed to load locations:", result.message);
                }
            } catch (err) {
                console.error("Could not reach /api/locations:", err);
            }
        }

        // -------------------------------------------------------
        // FETCH STATION SCHEDULE FROM THE SERVER
        //
        // Reads from the same database as dashboard.html via:
        // GET /api/station-schedule?date=YYYY-MM-DD&location=...
        //
        // Expected response shape:
        // {
        //   "success": true,
        //   "stations": {
        //     "Station 1": [
        //       { "status": "occupied", "start_time": "09:00", "end_time": "11:00" },
        //       { "status": "reserved", "start_time": "13:00", "end_time": "14:00" }
        //     ],
        //     "Station 2": [ ... ],
        //     ...
        //   }
        // }
        //
        // Returns the FULL list of appointments for the chosen day
        // to display the entire timeline at once.
        // -------------------------------------------------------

        async function fetchStationSchedule() {
            const locationSelect = document.getElementById("dashboard-location-select");
            const dateInput = document.getElementById("appt_date");

            const location = locationSelect ? locationSelect.value : "";
            const date = dateInput && dateInput.value ? dateInput.value : todayISO();

            const closedNotice = document.getElementById("closed-notice");
            const timelineGrid = document.getElementById("timelineGrid");

            if (!location) {
                // No active locations configured - fetchLocations()
                // already shows the "no locations" notice in this case.
                stationsData = [];
                renderTimeline();
                renderSummary();
                return;
            }

            if (isSelectedDateWeekend()) {
                // The timeline box itself (and the prev/next day arrows
                // flanking it) stays on screen - only its contents swap
                // to the closed message - so the user can keep stepping
                // through dates without anything jumping around.
                stationsData = [];
                renderSummary();
                timelineGrid.style.display = "none";
                closedNotice.style.display = "flex";
                return;
            }

            timelineGrid.style.display = "grid";
            closedNotice.style.display = "none";

            try {
                // cache: "no-store" ensures we never render a browser-cached
                // copy of this response - matches dashboard.html's
                // fetchStationStatus() so the timeline always reflects
                // whatever is currently in the database.
                const response = await fetch(`/api/station-schedule?date=${encodeURIComponent(date)}&location=${encodeURIComponent(location)}`, { cache: "no-store" });
                const result = await response.json();

                if (!result.success) {
                    console.error("Failed to load station schedule:", result.message || "Unknown error");
                    return;
                }

                // Transform database records into timeline display format
                stationsData = Object.entries(result.stations).map(([name, appointments]) => ({
                    name: name,
                    appointments: (appointments || []).map(function (a) {
                        return {
                            status: a.status || "reserved",
                            start: a.start_time,
                            end: a.end_time,
                        };
                    }),
                }));

                // Order stations numerically: Station 1..N
                stationsData.sort(function (a, b) {
                    function stationNum(s) {
                        const m = s.name.match(/(\d+)$/);
                        return m ? parseInt(m[1], 10) : Number.POSITIVE_INFINITY;
                    }
                    return stationNum(a) - stationNum(b);
                });

                renderTimeline();
                renderSummary();
            } catch (err) {
                console.error("Could not reach /api/station-schedule:", err);
            }
        }

        function todayISO() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, "0");
            const d = String(now.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
        }

        // -------------------------------------------------------
        // RENDER TIMELINE (time on the Y axis, stations on the X axis)
        // -------------------------------------------------------

        // Sizes each station column so that, whenever there's room, exactly
        // VISIBLE_STATIONS columns fill the box edge-to-edge - fewer
        // stations stretch to fill the same space, more stations keep that
        // same width and scroll horizontally past it. Recomputed from the
        // box's live clientWidth, so it also adapts to window resizes and
        // browser zoom instead of relying on a fixed pixel value.
        function computeStationColWidth(stationCount) {
            const scroller = document.getElementById("timelineScroll");
            const availableWidth = scroller.clientWidth - TIME_COL_WIDTH;
            const columnsToFit = Math.min(VISIBLE_STATIONS, Math.max(stationCount, 1));
            const width = availableWidth / columnsToFit;
            return Math.max(width, MIN_STATION_COL_WIDTH);
        }

        function renderTimeline() {
            const grid = document.getElementById("timelineGrid");
            grid.innerHTML = "";

            const stationCount = stationsData.length;
            const totalBodyRows = SLOTS_PER_DAY; // 18 half-hour rows
            const totalRows = 1 + totalBodyRows + 1; // header + body + zero-height closing row
            const stationColWidth = computeStationColWidth(stationCount);

            grid.style.gridTemplateColumns = `${TIME_COL_WIDTH}px repeat(${stationCount}, ${stationColWidth}px)`;
            grid.style.gridTemplateRows = `45px repeat(${totalBodyRows}, 35px) 20px`;

            // Corner cell
            const corner = document.createElement("div");
            corner.className = "tl-corner";
            corner.style.gridColumn = "1";
            corner.style.gridRow = "1";
            grid.appendChild(corner);

            // Station headers
            stationsData.forEach(function (station, index) {
                const header = document.createElement("div");
                header.className = "tl-station-header";
                header.style.gridColumn = String(index + 2);
                header.style.gridRow = "1";
                header.textContent = station.name;
                grid.appendChild(header);
            });

            // A thin line between every row (every half hour) ...
            for (let slot = 0; slot <= totalBodyRows; slot++) {
                const rowIndex = 2 + slot;
                const line = document.createElement("div");
                line.className = "tl-gridline";
                line.style.gridColumn = `1 / span ${stationCount + 1}`;
                line.style.gridRow = String(rowIndex);
                grid.appendChild(line);
            }

            // ... and an hour label (8:00 AM ... 5:00 PM) on every other line
            HOUR_LABELS.forEach(function (h) {
                const rowIndex = timeToGridRow(String(h).padStart(2, "0") + ":00");

                const label = document.createElement("div");
                label.className = "tl-time-label";
                label.style.gridColumn = "1";
                label.style.gridRow = String(rowIndex);
                label.textContent = formatHour12(h);
                grid.appendChild(label);
            });

            // Appointment blocks
            stationsData.forEach(function (station, index) {
                station.appointments.forEach(function (appt) {
                    if (!appt.start || !appt.end) {
                        console.warn("Skipping appointment missing start/end", appt);
                        return;
                    }

                    const rowStart = timeToGridRow(appt.start);
                    const rowEnd = timeToGridRow(appt.end);
                    if (rowEnd <= rowStart) {
                        console.warn("Skipping appointment with invalid row range", appt, rowStart, rowEnd);
                        return;
                    }

                    const block = document.createElement("div");
                    const statusClass = normalizeStatus(appt.status);
                    block.className = "tl-block " + statusClass;
                    block.style.gridColumn = String(index + 2);
                    block.style.gridRow = `${rowStart} / ${rowEnd}`;

                    const statusEl = document.createElement("div");
                    statusEl.className = "tl-block-status";
                    statusEl.textContent = statusLabels[statusClass] || statusClass;

                    const timeEl = document.createElement("div");
                    timeEl.className = "tl-block-time";
                    timeEl.textContent = formatTimeLabel(appt.start) + " to " + formatTimeLabel(appt.end);

                    block.appendChild(statusEl);
                    block.appendChild(timeEl);
                    grid.appendChild(block);
                });
            });
        }

        // -------------------------------------------------------
        // RENDER STATUS SUMMARY (counts appointments across the day)
        // -------------------------------------------------------

        function renderSummary() {
            const counts = { vacant: 0, occupied: 0, reserved: 0 };

            stationsData.forEach(function (station) {
                station.appointments.forEach(function (appt) {
                    const normalizedStatus = normalizeStatus(appt.status);
                    if (counts[normalizedStatus] !== undefined) {
                        counts[normalizedStatus]++;
                    }
                });
            });

            const summary = document.getElementById("status-summary");
            summary.innerHTML =
                "<span>Reserved: " + counts.reserved + "</span>" +
                "<span>Occupied: " + counts.occupied + "</span>" +
                "<span>Vacant: " + counts.vacant + "</span>" +
                "<span>Stations: " + stationsData.length + "</span>";
        }

        // -------------------------------------------------------
        // DATE NAVIGATION (prev/next day arrows)
        // Single page, single date: the left arrow steps the date
        // picker back one day, the right arrow steps it forward one
        // day, and each click reloads that day's schedule. Scrolling
        // *through* a day's timeline (more stations than fit, or more
        // of the day than fits vertically) is handled by the timeline
        // box's own scrollbars instead - the arrows only ever change
        // which date is showing.
        // -------------------------------------------------------

        function shiftSelectedDate(deltaDays) {
            const dateInput = document.getElementById("appt_date");

            // Fall back to today if the field is somehow empty so a
            // click never silently does nothing.
            const base = dateInput.value ? dateInput.value : todayISO();
            const [y, m, d] = base.split("-").map(Number);

            const next = new Date(y, m - 1, d);
            next.setDate(next.getDate() + deltaDays);

            const yyyy = next.getFullYear();
            const mm = String(next.getMonth() + 1).padStart(2, "0");
            const dd = String(next.getDate()).padStart(2, "0");
            dateInput.value = `${yyyy}-${mm}-${dd}`;

            fetchStationSchedule();
        }

        // -------------------------------------------------------
        // INIT
        // -------------------------------------------------------

        document.getElementById("appt_date").value = todayISO();

        // Same init pattern as dashboard.html: the dropdown is already
        // correctly populated server-side (Jinja `locations` loop), so
        // the first schedule fetch doesn't need to wait on the location
        // fetch - it just runs against whatever's already selected.
        fetchLocations();                        // populate the location dropdown from the database
        fetchStationSchedule();                  // initial load from the database
        setInterval(fetchStationSchedule, 15000); // refresh the timeline every 15 seconds
        setInterval(fetchLocations, 60000);       // pick up location changes every minute

        document.getElementById("dashboard-location-select").addEventListener("change", fetchStationSchedule);
        document.getElementById("appt_date").addEventListener("change", fetchStationSchedule);

        // Re-measure and redraw the existing data (no need to refetch) any
        // time the window is resized or the browser zoom level changes, so
        // the station column width keeps matching the box's current size.
        let resizeRedrawTimer = null;
        window.addEventListener("resize", function () {
            clearTimeout(resizeRedrawTimer);
            resizeRedrawTimer = setTimeout(renderTimeline, 100);
        });
    </script>
</body>
</html>
